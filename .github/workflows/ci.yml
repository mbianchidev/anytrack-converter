name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Configure Rust runner
        id: runner
        run: |
          workers=$(nproc)
          printf 'CARGO_BUILD_JOBS=%s\nRUST_TEST_THREADS=%s\n' "$workers" "$workers" >> "$GITHUB_ENV"
          printf 'image-os=%s\n' "${ImageOS:?Missing runner image OS identifier}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            backend/target/
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.image-os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml', '.cargo/config*', 'backend/.cargo/config*') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build --no-cache -t anytrack-backend ./backend

      - name: Build frontend image
        run: docker build --no-cache -t anytrack-frontend ./frontend

      - name: Smoke test container startup
        run: |
          docker run -d --name anytrack-backend-smoke -p 127.0.0.1:18080:8080 anytrack-backend
          docker run -d --name anytrack-frontend-smoke -p 127.0.0.1:13000:80 anytrack-frontend
          for endpoint in http://127.0.0.1:18080/health http://127.0.0.1:13000; do
            curl --fail --connect-timeout 5 --max-time 10 --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 60 "$endpoint"
          done

      - name: Container logs and cleanup
        if: always()
        run: |
          for container in anytrack-backend-smoke anytrack-frontend-smoke; do
            if docker container inspect "$container" > /dev/null 2>&1; then
              docker logs "$container"
              docker rm -f "$container"
            fi
          done
