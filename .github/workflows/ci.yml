name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --no-cache -t anytrack-backend ./backend

      - name: Build frontend image
        run: docker build --no-cache -t anytrack-frontend ./frontend

      - name: Smoke test container startup
        run: |
          docker run -d --name anytrack-backend-smoke -p 127.0.0.1:18080:8080 anytrack-backend
          docker run -d --name anytrack-frontend-smoke -p 127.0.0.1:13000:80 anytrack-frontend
          for endpoint in http://127.0.0.1:18080/health http://127.0.0.1:13000; do
            curl --fail --connect-timeout 5 --max-time 10 --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 60 "$endpoint"
          done

      - name: Container logs and cleanup
        if: always()
        run: |
          for container in anytrack-backend-smoke anytrack-frontend-smoke; do
            if docker container inspect "$container" > /dev/null 2>&1; then
              docker logs "$container"
              docker rm -f "$container"
            fi
          done
